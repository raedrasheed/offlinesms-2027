android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Low-memory build settings — compile Kotlin in the Gradle daemon (no separate
# Kotlin daemon) and use ParallelGC to avoid the G1 mark-stack reservation that
# OOMs on machines with little free RAM. Raise -Xmx if you have more headroom.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
