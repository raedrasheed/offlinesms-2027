<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OfflineSMS — messaging that works everywhere</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f8fb; color: #1c2733;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card { text-align: center; max-width: 460px; }
    .logo { width: 84px; height: 84px; border-radius: 18px; margin: 0 auto 20px; }
    h1 { font-size: 26px; margin-bottom: 10px; }
    h1 span { color: #01A0E1; }
    p  { font-size: 15px; color: #5a6b7b; line-height: 1.6; margin-bottom: 26px; }
    a.btn {
      display: inline-block; padding: 14px 26px; border-radius: 10px; font-size: 15px;
      font-weight: 700; text-decoration: none; background: #01A0E1; color: #fff;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.png" alt="OfflineSMS" onerror="this.style.display='none'" />
    <h1>Offline<span>SMS</span></h1>
    <p>Chat with anyone — even when they’re offline. Messages reach phone-only contacts by SMS and sync seamlessly when they join.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=app.offlinesms.mobile">Get the app</a>
  </div>
</body>
</html>
