<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex" />
  <title>Join group — OfflineSMS</title>
  <style>
    :root { --primary: #12678a; --ink: #1c2733; --ink-500: #5a6b7b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f8fb; color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 32px 28px; max-width: 420px; width: 100%;
      text-align: center; box-shadow: 0 8px 30px rgba(31, 123, 168, 0.12);
    }
    .logo { width: 64px; height: 64px; border-radius: 14px; margin: 0 auto 18px; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p  { font-size: 14px; color: var(--ink-500); line-height: 1.55; margin-bottom: 22px; }
    .btn {
      display: block; width: 100%; padding: 14px; border-radius: 10px; font-size: 15px;
      font-weight: 700; text-decoration: none; margin-bottom: 10px; cursor: pointer; border: 0;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-ghost   { background: #eaf6fc; color: var(--primary); }
    .store { color: var(--primary); display: inline-block; margin-top: 8px; font-size: 14px; }
    a:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/logo.png" alt="OfflineSMS" />
    <h1 id="heading">You’re invited to a group</h1>
    <p id="subtitle">Enable JavaScript to open this group invitation.</p>

    <div id="actions" hidden>
      <a class="btn btn-primary" id="webLink">Continue in browser</a>
      <a class="btn btn-ghost" id="appLink">Open in the OfflineSMS app</a>
      <a class="store" id="playLink" href="https://play.google.com/store/apps/details?id=app.offlinesms.mobile">Get the app on Google Play</a>
    </div>
  </main>

  <script>
    const arabic = /^ar(?:-|$)/i.test(navigator.language);
    const copy = arabic ? {
      title: 'دعوة إلى مجموعة — OfflineSMS',
      heading: 'أنت مدعو للانضمام إلى مجموعة',
      ready: 'سجّل الدخول إلى حساب OfflineSMS في المتصفح أو افتح الدعوة في التطبيق.',
      invalid: 'رابط الدعوة غير صالح. اطلب من مدير المجموعة مشاركة الرابط مجددًا.',
      web: 'المتابعة في المتصفح',
      app: 'فتح في تطبيق OfflineSMS',
      play: 'تنزيل التطبيق من Google Play',
    } : {
      title: 'Join group — OfflineSMS',
      heading: 'You’re invited to a group',
      ready: 'Sign in to OfflineSMS in your browser or open the invitation in the app.',
      invalid: 'This invitation link is invalid. Ask the group admin to share it again.',
      web: 'Continue in browser',
      app: 'Open in the OfflineSMS app',
      play: 'Get the app on Google Play',
    };
    document.documentElement.lang = arabic ? 'ar' : 'en';
    document.documentElement.dir = arabic ? 'rtl' : 'ltr';
    document.title = copy.title;
    document.getElementById('heading').textContent = copy.heading;

    // Use the same invite-code format as the Firebase callables.
    const code = location.pathname.match(/^\/join\/([ABCDEFGHJKMNPQRSTVWXYZ0123456789]{8,40})\/?$/)?.[1];
    document.getElementById('subtitle').textContent = code ? copy.ready : copy.invalid;
    if (code) {
      const webLink = document.getElementById('webLink');
      webLink.href = 'https://web.offlinesms.com/#join=' + code;
      webLink.textContent = copy.web;
      const appLink = document.getElementById('appLink');
      appLink.href = 'offlinesms://join/' + code;
      appLink.textContent = copy.app;
      document.getElementById('playLink').textContent = copy.play;
      document.getElementById('actions').hidden = false;
    }
  </script>
</body>
</html>
