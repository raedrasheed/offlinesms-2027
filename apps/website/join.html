<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join group — OfflineSMS</title>
  <style>
    :root { --primary: #01A0E1; --primary-dark: #1F7BA8; --ink: #1c2733; --ink-500: #5a6b7b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f8fb; color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 32px 28px; max-width: 420px; width: 100%;
      text-align: center; box-shadow: 0 8px 30px rgba(31, 123, 168, 0.12);
    }
    .logo { width: 64px; height: 64px; border-radius: 14px; margin: 0 auto 18px; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p  { font-size: 14px; color: var(--ink-500); line-height: 1.55; margin-bottom: 22px; }
    .btn {
      display: block; width: 100%; padding: 14px; border-radius: 10px; font-size: 15px;
      font-weight: 700; text-decoration: none; margin-bottom: 10px; cursor: pointer; border: 0;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-ghost   { background: #eaf6fc; color: var(--primary-dark); }
    .hint { font-size: 12px; color: var(--ink-500); margin-top: 14px; margin-bottom: 0; }
    code { background: #f0f4f7; padding: 2px 6px; border-radius: 5px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.png" alt="OfflineSMS" onerror="this.style.display='none'" />
    <h1>You’re invited to a group</h1>
    <p id="subtitle">Opening OfflineSMS…</p>

    <button class="btn btn-primary" id="openBtn">Open in OfflineSMS</button>
    <a class="btn btn-ghost" id="playBtn"
       href="https://play.google.com/store/apps/details?id=app.offlinesms.mobile">
      Get the app on Google Play
    </a>

    <p class="hint" id="codeHint"></p>
  </div>

  <script>
    // Mirror of apps/mobile/src/lib/invite.ts parseInviteCode.
    var m = location.pathname.match(/\/join\/([A-Za-z0-9]+)/);
    var code = m ? m[1] : null;

    var subtitle = document.getElementById('subtitle');
    var codeHint = document.getElementById('codeHint');
    var openBtn  = document.getElementById('openBtn');

    if (!code) {
      subtitle.textContent = 'This invite link looks incomplete. Ask the group admin to share it again.';
      openBtn.style.display = 'none';
    } else {
      codeHint.innerHTML = 'Invite code: <code>' + code + '</code>';

      var deepLink = 'offlinesms://join/' + code;
      function tryOpen() { location.href = deepLink; }
      openBtn.addEventListener('click', tryOpen);

      // Auto-attempt once on load. If the app is installed Android/iOS will
      // switch to it; if not, the user stays here and can use the store link.
      // (On devices with verified App Links / Universal Links, tapping the
      // https link opens the app directly and this page is never shown.)
      setTimeout(tryOpen, 350);
      setTimeout(function () {
        subtitle.textContent = "Don't have the app yet? Install it, then tap the invite link again.";
      }, 2500);
    }
  </script>
</body>
</html>
