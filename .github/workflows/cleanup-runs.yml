name: Cleanup old workflow runs

on:
  workflow_dispatch:
    inputs:
      days_to_keep:
        description: 'Keep workflow runs newer than this many days'
        required: true
        default: '30'
      dry_run:
        description: 'Preview only, do not delete'
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old completed workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const keepDays = Number('${{ inputs.days_to_keep }}');
            const dryRun = '${{ inputs.dry_run }}' === 'true';
            if (!Number.isFinite(keepDays) || keepDays < 1) {
              core.setFailed('days_to_keep must be a positive number');
              return;
            }

            const cutoff = new Date(Date.now() - keepDays * 24 * 60 * 60 * 1000);
            core.info(`Cutoff: ${cutoff.toISOString()}`);
            core.info(`Dry run: ${dryRun}`);

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                status: 'completed'
              }
            );

            let matched = 0;
            let deleted = 0;

            for (const run of runs) {
              if (run.id === context.runId) continue;
              const created = new Date(run.created_at);
              if (created >= cutoff) continue;

              matched++;
              core.info(`${dryRun ? '[DRY RUN] ' : ''}Deleting run #${run.run_number} (${run.id}) created ${run.created_at}: ${run.name}`);

              if (!dryRun) {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                deleted++;
              }
            }

            core.summary
              .addHeading('Cleanup summary')
              .addTable([
                [{data: 'Setting', header: true}, {data: 'Value', header: true}],
                ['Days kept', String(keepDays)],
                ['Cutoff', cutoff.toISOString()],
                ['Dry run', String(dryRun)],
                ['Old completed runs matched', String(matched)],
                ['Runs deleted', String(deleted)]
              ])
              .write();
