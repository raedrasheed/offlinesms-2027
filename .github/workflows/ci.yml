name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'claude/**'
      - 'feature/**'

jobs:
  validate:
    name: install · typecheck · lint · i18n · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Avoid Husky-style hook installs from blocking CI.
      HUSKY: '0'
      # Next.js needs telemetry off in CI to keep logs clean.
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # apps/mobile is intentionally NOT an npm workspace (Expo SDK 53 / React 19
      # vs the dashboard's React 18 — npm's single-root hoisting can't host both).
      # It installs standalone, so it must be installed and checked separately.
      - name: Install mobile app (standalone)
        run: npm --prefix apps/mobile ci

      - name: Typecheck (all workspaces)
        run: npm run typecheck --workspaces --if-present

      - name: Typecheck mobile app
        run: npm --prefix apps/mobile run typecheck

      - name: Lint (all workspaces)
        run: npm run lint --workspaces --if-present

      - name: i18n parity check (EN ↔ AR)
        run: npm run i18n:check

      - name: Test (vitest unit suites)
        run: npm run test

      - name: Build (all workspaces)
        run: npm run build --workspaces --if-present

# Firestore rules tests (tests/rules/) require the Firestore emulator
# which depends on Java. They run locally via:
#   firebase emulators:start --only firestore   (Terminal A)
#   npm run test:rules                          (Terminal B)
# A dedicated rules-test job that boots the emulator can be added in a
# future phase.
