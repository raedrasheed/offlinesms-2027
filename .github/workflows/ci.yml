name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
      - 'feature/**'

jobs:
  validate:
    name: install · typecheck · lint · i18n · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Avoid Husky-style hook installs from blocking CI.
      HUSKY: '0'
      # Next.js needs telemetry off in CI to keep logs clean.
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # apps/mobile is intentionally NOT an npm workspace (Expo SDK 53 / React 19
      # vs the dashboard's React 18 — npm's single-root hoisting can't host both).
      # It installs standalone, so it must be installed and checked separately.
      - name: Install mobile app (standalone)
        run: npm --prefix apps/mobile ci

      - name: Typecheck (all workspaces)
        run: npm run typecheck --workspaces --if-present

      - name: Typecheck mobile app
        run: npm --prefix apps/mobile run typecheck

      - name: Lint (all workspaces)
        run: npm run lint --workspaces --if-present

      - name: i18n parity check (EN ↔ AR)
        run: npm run i18n:check

      - name: Test (vitest unit suites)
        run: npm run test

      - name: Build (all workspaces)
        run: npm run build --workspaces --if-present

  # Security gate for SMS/OTP abuse protection: Firestore rules, emulator-backed
  # handler tests (public phone sign-in, linking, relay enforcement, email OTP,
  # remediation), wire-level callable tests through the Functions emulator, and
  # the relay app's Android-free send pipeline on a plain JVM. No SMS/email is sent:
  # every provider and relay is emulated or mocked.
  security-emulators:
    name: rules · integration · callable (emulators) · relay send pipeline (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 21 (Firestore emulator, Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Firestore rules tests (emulator)
        run: npx firebase emulators:exec --project demo-offlinesms --only firestore "npm run test:rules"

      - name: Handler integration tests (Firestore + Auth emulators)
        run: npm run test:integration

      - name: Wire-level callable tests (Functions + Firestore + Auth emulators)
        run: npm run test:callable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Relay send pipeline (plain JVM, no Android SDK)
        run: gradle -p apps/mobile-relay/sendgate-jvm-test test --no-daemon

  # Full relay Android application: compile + package the debug APK (AGP, Room
  # kapt, resources, manifest) and run its unit/integration tests — the send
  # pipeline with fakes, and Room + RelayApi + production pipeline wiring over a
  # fake callable transport under Robolectric. Uses a NON-PRODUCTION placeholder
  # google-services.json. Not covered here: SmsManager/carrier behaviour, the
  # foreground service lifecycle and FCM on a real device.
  relay-android:
    name: relay app · assembleDebug · unit + Robolectric integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The hosted runner image ships the Android SDK; make sure the exact
      # platform/build-tools this app compiles against are present.
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Placeholder google-services.json (non-production)
        run: bash scripts/ci/relay-google-services.sh

      - name: Build relay APK and run its tests
        run: gradle -p apps/mobile-relay :app:assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Relay test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-test-reports
          path: apps/mobile-relay/app/build/reports/tests/
          if-no-files-found: ignore

  # Installable Android build of the MAIN mobile app (release JS bundle, debug
  # signing — no release keystore in CI). Downloadable from the run's
  # "Artifacts" section. Backend selection, never production:
  #   • repository secret MOBILE_GOOGLE_SERVICES_JSON + variables
  #     MOBILE_TEST_FIREBASE_{API_KEY,AUTH_DOMAIN,PROJECT_ID,STORAGE_BUCKET,
  #     APP_ID,MESSAGING_SENDER_ID} for a NON-production test project → a
  #     usable test build ("test-backend");
  #   • otherwise placeholders → the app installs and opens but cannot sign in
  #     or receive push ("placeholder-backend", UI/smoke only).
  # The script refuses a google-services.json for offlinesms-prod-2027.
  mobile-android:
    name: mobile app · installable APK
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MOBILE_GOOGLE_SERVICES_JSON: ${{ secrets.MOBILE_GOOGLE_SERVICES_JSON }}
      TEST_PROJECT_ID: ${{ vars.MOBILE_TEST_FIREBASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      - name: Install mobile dependencies
        run: npm --prefix apps/mobile ci

      - name: Backend configuration (never production)
        id: backend
        run: |
          if [ -n "$MOBILE_GOOGLE_SERVICES_JSON" ] && [ -n "$TEST_PROJECT_ID" ]; then
            if [ "$TEST_PROJECT_ID" = "offlinesms-prod-2027" ]; then echo "refusing production project" >&2; exit 1; fi
            echo "label=test-backend-$TEST_PROJECT_ID" >> "$GITHUB_OUTPUT"
            {
              echo "EXPO_PUBLIC_FIREBASE_API_KEY=${{ vars.MOBILE_TEST_FIREBASE_API_KEY }}"
              echo "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.MOBILE_TEST_FIREBASE_AUTH_DOMAIN }}"
              echo "EXPO_PUBLIC_FIREBASE_PROJECT_ID=$TEST_PROJECT_ID"
              echo "EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.MOBILE_TEST_FIREBASE_STORAGE_BUCKET }}"
              echo "EXPO_PUBLIC_FIREBASE_APP_ID=${{ vars.MOBILE_TEST_FIREBASE_APP_ID }}"
              echo "EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.MOBILE_TEST_FIREBASE_MESSAGING_SENDER_ID }}"
            } >> "$GITHUB_ENV"
          else
            unset MOBILE_GOOGLE_SERVICES_JSON   # half-configured → placeholder, never a mix
            echo "label=placeholder-backend" >> "$GITHUB_OUTPUT"
            {
              echo "EXPO_PUBLIC_FIREBASE_API_KEY=AIzaSyDUMMY-NOT-A-REAL-KEY-000000000000"
              echo "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=demo-offlinesms-ci.firebaseapp.com"
              echo "EXPO_PUBLIC_FIREBASE_PROJECT_ID=demo-offlinesms-ci"
              echo "EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=demo-offlinesms-ci.appspot.com"
              echo "EXPO_PUBLIC_FIREBASE_APP_ID=1:000000000000:android:0000000000000001"
              echo "EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=000000000000"
            } >> "$GITHUB_ENV"
          fi
          # The script writes the supplied test-project file, or the placeholder.
          bash scripts/ci/mobile-google-services.sh

      - name: Build release APK (debug-signed)
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
          # Test build: log the in-app perf marks to logcat for on-device timing.
          EXPO_PUBLIC_PERF_LOG: '1'
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon

      - name: Name the APK after the commit and backend
        id: apk
        run: |
          name="offlinesms-${{ github.event.pull_request.head.sha || github.sha }}-${{ steps.backend.outputs.label }}.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$name"
          sha256sum "$name" | tee "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256
          retention-days: 30
