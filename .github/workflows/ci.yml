name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'claude/**'
      - 'feature/**'

jobs:
  validate:
    name: install · typecheck · lint · i18n · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Avoid Husky-style hook installs from blocking CI.
      HUSKY: '0'
      # Next.js needs telemetry off in CI to keep logs clean.
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # apps/mobile is intentionally NOT an npm workspace (Expo SDK 53 / React 19
      # vs the dashboard's React 18 — npm's single-root hoisting can't host both).
      # It installs standalone, so it must be installed and checked separately.
      - name: Install mobile app (standalone)
        run: npm --prefix apps/mobile ci

      - name: Typecheck (all workspaces)
        run: npm run typecheck --workspaces --if-present

      - name: Typecheck mobile app
        run: npm --prefix apps/mobile run typecheck

      - name: Lint (all workspaces)
        run: npm run lint --workspaces --if-present

      - name: i18n parity check (EN ↔ AR)
        run: npm run i18n:check

      - name: Test (vitest unit suites)
        run: npm run test

      - name: Build (all workspaces)
        run: npm run build --workspaces --if-present

  # Security gate for SMS/OTP abuse protection: Firestore rules, emulator-backed
  # handler tests (public phone sign-in, linking, relay enforcement, email OTP,
  # remediation), wire-level callable tests through the Functions emulator, and
  # the relay app's Android-free send pipeline on a plain JVM. No SMS/email is sent:
  # every provider and relay is emulated or mocked.
  security-emulators:
    name: rules · integration · callable (emulators) · relay send pipeline (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 21 (Firestore emulator, Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Firestore rules tests (emulator)
        run: npx firebase emulators:exec --project demo-offlinesms --only firestore "npm run test:rules"

      - name: Handler integration tests (Firestore + Auth emulators)
        run: npm run test:integration

      - name: Wire-level callable tests (Functions + Firestore + Auth emulators)
        run: npm run test:callable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Relay send pipeline (plain JVM, no Android SDK)
        run: gradle -p apps/mobile-relay/sendgate-jvm-test test --no-daemon

  # Full relay Android application: compile + package the debug APK (AGP, Room
  # kapt, resources, manifest) and run its unit/integration tests — the send
  # pipeline with fakes, and Room + RelayApi + production pipeline wiring over a
  # fake callable transport under Robolectric. Uses a NON-PRODUCTION placeholder
  # google-services.json. Not covered here: SmsManager/carrier behaviour, the
  # foreground service lifecycle and FCM on a real device.
  relay-android:
    name: relay app · assembleDebug · unit + Robolectric integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The hosted runner image ships the Android SDK; make sure the exact
      # platform/build-tools this app compiles against are present.
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Placeholder google-services.json (non-production)
        run: bash scripts/ci/relay-google-services.sh

      - name: Build relay APK and run its tests
        run: gradle -p apps/mobile-relay :app:assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Relay test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-test-reports
          path: apps/mobile-relay/app/build/reports/tests/
          if-no-files-found: ignore
