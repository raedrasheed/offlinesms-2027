name: Production Android release

# Builds the PRODUCTION Android apps from one reviewed commit, signed with the
# production keys, against offlinesms-prod-2027 (docs/PRODUCTION_RELEASE.md §4):
#   user app  app.offlinesms.mobile   AAB for Google Play + an APK of the same
#                                      build for the checks below
#   relay     app.offlinesms.business APK for the private relay phones
# Nothing is uploaded to Play or installed anywhere: the artifacts and their
# BUILD-INFO.txt go to review first.
#
# Manual only (Actions → Production Android release → Run workflow), and only
# from the default branch once the release is merged. Runs in the GitHub
# environment "production" (Settings → Environments; add required reviewers
# there). Every setting below lives in that environment, none has a fallback,
# and anything missing or mismatched fails the job. The repository's test
# signing key (apps/mobile/android/app/debug.keystore, SHA-256 fac61745…3b9c)
# is refused for both apps.
#
#   secret PROD_GOOGLE_SERVICES_JSON   google-services.json of offlinesms-prod-2027 with
#                                      the Android apps app.offlinesms.mobile and
#                                      app.offlinesms.business
#   vars   PROD_FIREBASE_{API_KEY,AUTH_DOMAIN,PROJECT_ID,STORAGE_BUCKET,APP_ID,MESSAGING_SENDER_ID}
#                                      the production web config (the app's JS SDK)
#   user app upload key (the key Google Play expects uploads to be signed with):
#     secrets MOBILE_UPLOAD_KEYSTORE_BASE64, MOBILE_UPLOAD_KEYSTORE_PASSWORD,
#             MOBILE_UPLOAD_KEY_ALIAS, MOBILE_UPLOAD_KEY_PASSWORD
#     var     MOBILE_UPLOAD_CERT_SHA256   Play Console → Test and release → App integrity →
#                                         Upload key certificate → SHA-256
#   relay key (the key of the relay already installed on the production phones):
#     secrets RELAY_RELEASE_KEYSTORE_BASE64, RELAY_RELEASE_KEYSTORE_PASSWORD,
#             RELAY_RELEASE_KEY_ALIAS, RELAY_RELEASE_KEY_PASSWORD
#     var     RELAY_RELEASE_CERT_SHA256   certificate SHA-256 of the installed relay
on:
  workflow_dispatch:
    inputs:
      commit:
        description: The reviewed commit (at least 7 hex characters); the run refuses any other
        required: true
        type: string
      target:
        description: What to build
        type: choice
        options: [both, user-app, relay]
        default: both

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

env:
  PROD: offlinesms-prod-2027
  TEST_CERT: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c

jobs:
  user-app:
    name: user app · production AAB + APK
    if: inputs.target != 'relay'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      COMMIT: ${{ inputs.commit }}
      MOBILE_GOOGLE_SERVICES_JSON: ${{ secrets.PROD_GOOGLE_SERVICES_JSON }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.PROD_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PROD_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PROD_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.PROD_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.PROD_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.PROD_FIREBASE_MESSAGING_SENDER_ID }}
      EXPECTED_CERT: ${{ vars.MOBILE_UPLOAD_CERT_SHA256 }}
      KS_BASE64: ${{ secrets.MOBILE_UPLOAD_KEYSTORE_BASE64 }}
      KS_PASSWORD: ${{ secrets.MOBILE_UPLOAD_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.MOBILE_UPLOAD_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.MOBILE_UPLOAD_KEY_PASSWORD }}
      PKG: app.offlinesms.mobile
      BT: 36.0.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reviewed commit, default branch, settings present
        run: bash scripts/release/preflight.sh

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      - name: Production backend is one project (keys checked with Identity Toolkit)
        run: node scripts/ci/check-backend-config.mjs --production --package "$PKG"

      - name: Production upload key (certificate checked before building)
        run: bash scripts/release/signing-key.sh apps/mobile/android/keystore.properties

      - name: Install mobile dependencies
        run: npm --prefix apps/mobile ci

      - name: Build the production AAB and APK
        run: |
          printf '%s' "$MOBILE_GOOGLE_SERVICES_JSON" > apps/mobile/google-services.json
          cp apps/mobile/google-services.json apps/mobile/android/app/google-services.json
          # Store builds never carry test switches or timing logs (scripts/test-builds/build.sh sets them).
          unset EXPO_PUBLIC_TEST_FAULTS EXPO_PUBLIC_PERF_LOG
          ls apps/mobile/.env* 2>/dev/null | grep -v '\.env\.example$' && { echo "::error::apps/mobile has a .env file; Expo would inline it"; exit 1; }
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' >> ~/.gradle/gradle.properties
          cd apps/mobile/android
          NODE_ENV=production ./gradlew bundleRelease assembleRelease --no-daemon --console=plain

      - name: Verify package, versions, signature, 16 KB alignment and backend
        run: |
          mkdir -p dist
          AAB=apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          bash scripts/release/verify-build.sh "$APK" "$AAB" apps/mobile/google-services.json --web-config-env

      - name: Remove the key and config from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" apps/mobile/android/keystore.properties apps/mobile/google-services.json apps/mobile/android/app/google-services.json

      - name: Upload the user app
        uses: actions/upload-artifact@v4
        with:
          name: offlinesms-production-user-app
          path: dist/
          retention-days: 7

  relay:
    name: relay · production APK
    if: inputs.target != 'user-app'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      COMMIT: ${{ inputs.commit }}
      MOBILE_GOOGLE_SERVICES_JSON: ${{ secrets.PROD_GOOGLE_SERVICES_JSON }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.PROD_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PROD_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PROD_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.PROD_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.PROD_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.PROD_FIREBASE_MESSAGING_SENDER_ID }}
      EXPECTED_CERT: ${{ vars.RELAY_RELEASE_CERT_SHA256 }}
      KS_BASE64: ${{ secrets.RELAY_RELEASE_KEYSTORE_BASE64 }}
      KS_PASSWORD: ${{ secrets.RELAY_RELEASE_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.RELAY_RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.RELAY_RELEASE_KEY_PASSWORD }}
      PKG: app.offlinesms.business
      # The checks use current build tools (zipalign -P needs 35+); the app compiles with 34.
      BT: 36.0.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reviewed commit, default branch, settings present
        run: bash scripts/release/preflight.sh

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "build-tools;36.0.0" > /dev/null

      # No build cache for a release: nothing from another run reaches this build.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-disabled: true

      - name: Production backend is one project (keys checked with Identity Toolkit)
        run: node scripts/ci/check-backend-config.mjs --production --package "$PKG"

      - name: Production relay key (certificate checked before building)
        run: bash scripts/release/signing-key.sh apps/mobile-relay/keystore.properties

      - name: Build the production relay APK
        run: |
          printf '%s' "$MOBILE_GOOGLE_SERVICES_JSON" > apps/mobile-relay/app/google-services.json
          gradle -p apps/mobile-relay :app:assembleRelease --no-daemon --console=plain

      - name: Verify package, versions, signature and backend
        run: |
          mkdir -p dist
          bash scripts/release/verify-build.sh apps/mobile-relay/app/build/outputs/apk/release/app-release.apk "" apps/mobile-relay/app/google-services.json

      - name: Remove the key and config from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" apps/mobile-relay/keystore.properties apps/mobile-relay/app/google-services.json

      - name: Upload the relay
        uses: actions/upload-artifact@v4
        with:
          name: offlinesms-production-relay
          path: dist/
          retention-days: 7
